<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="An interactive Formula 1 lap comparison tool built by Prinel Pillay using HTML, CSS and JavaScript."
  >

  <title>F1 Lap Comparison Tool | Prinel Pillay</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="site-header">
    <div class="container">

      <p class="eyebrow">
        Motorsport Data Project
      </p>

      <h1>
        F1 Lap Comparison Tool
      </h1>

      <p class="intro">
        Compare two drivers across lap pace, fastest lap and consistency.
      </p>

    </div>
  </header>

  <main>

    <section class="comparison-controls">
      <div class="container">

        <div class="control-group">

          <!-- DRIVER A -->
          <div>
            <label for="driver-a">
              Driver A
            </label>

            <select id="driver-a">
              <option value="NOR">Lando Norris (McLaren)</option>
              <option value="PIA">Oscar Piastri (McLaren)</option>

              <option value="RUS">George Russell (Mercedes)</option>
              <option value="ANT">Kimi Antonelli (Mercedes)</option>

              <option value="LEC">Charles Leclerc (Ferrari)</option>
              <option value="HAM">Lewis Hamilton (Ferrari)</option>

              <option value="VER">Max Verstappen (Red Bull Racing)</option>
              <option value="HAD">Isack Hadjar (Red Bull Racing)</option>

              <option value="LAW">Liam Lawson (Racing Bulls)</option>
              <option value="LIN">Arvid Lindblad (Racing Bulls)</option>

              <option value="GAS">Pierre Gasly (Alpine)</option>
              <option value="COL">Franco Colapinto (Alpine)</option>

              <option value="OCO">Esteban Ocon (Haas)</option>
              <option value="BEA">Oliver Bearman (Haas)</option>

              <option value="HUL">Nico Hulkenberg (Audi)</option>
              <option value="BOR">Gabriel Bortoleto (Audi)</option>

              <option value="SAI">Carlos Sainz (Williams)</option>
              <option value="ALB">Alexander Albon (Williams)</option>

              <option value="ALO">Fernando Alonso (Aston Martin)</option>
              <option value="STR">Lance Stroll (Aston Martin)</option>

              <option value="PER">Sergio Perez (Cadillac)</option>
              <option value="BOT">Valtteri Bottas (Cadillac)</option>
            </select>
          </div>


          <!-- DRIVER B -->
          <div>
            <label for="driver-b">
              Driver B
            </label>

            <select id="driver-b">
              <option value="PIA">Oscar Piastri (McLaren)</option>
              <option value="NOR">Lando Norris (McLaren)</option>

              <option value="RUS">George Russell (Mercedes)</option>
              <option value="ANT">Kimi Antonelli (Mercedes)</option>

              <option value="LEC">Charles Leclerc (Ferrari)</option>
              <option value="HAM">Lewis Hamilton (Ferrari)</option>

              <option value="VER">Max Verstappen (Red Bull Racing)</option>
              <option value="HAD">Isack Hadjar (Red Bull Racing)</option>

              <option value="LAW">Liam Lawson (Racing Bulls)</option>
              <option value="LIN">Arvid Lindblad (Racing Bulls)</option>

              <option value="GAS">Pierre Gasly (Alpine)</option>
              <option value="COL">Franco Colapinto (Alpine)</option>

              <option value="OCO">Esteban Ocon (Haas)</option>
              <option value="BEA">Oliver Bearman (Haas)</option>

              <option value="HUL">Nico Hulkenberg (Audi)</option>
              <option value="BOR">Gabriel Bortoleto (Audi)</option>

              <option value="SAI">Carlos Sainz (Williams)</option>
              <option value="ALB">Alexander Albon (Williams)</option>

              <option value="ALO">Fernando Alonso (Aston Martin)</option>
              <option value="STR">Lance Stroll (Aston Martin)</option>

              <option value="PER">Sergio Perez (Cadillac)</option>
              <option value="BOT">Valtteri Bottas (Cadillac)</option>
            </select>
          </div>

        </div>

        <button id="compare-button" type="button">
          Compare drivers
        </button>

      </div>
    </section>


    <section class="comparison-results">
      <div class="container">

        <p class="section-label">
          Comparison
        </p>

        <h2>
          Driver performance
        </h2>

        <div id="results">

          <p>
            Choose two drivers and select “Compare drivers” to see the analysis.
          </p>

        </div>

      </div>
    </section>

  </main>

  <script src="js/app.js"></script>

</body>
</html>
